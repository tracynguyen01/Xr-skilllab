name = "xr-skilllab-coach"
main = "src/index.ts"
compatibility_date = "2026-10-19"

# AI_API_KEY is a secret. Set it with:
#   npx wrangler secret put AI_API_KEY
# Do not put the key in this file, in git, or in a GitHub Actions variable.
#
# AI_BASE_URL, AI_MODEL, and AI_DAILY_CAP are plain variables. Set them in the
# Cloudflare dashboard or uncomment [vars] when you are ready to spend.
# While they are unset, POST /coach refuses to call a model.
#
# Shared per-IP bucket and daily cap. The namespace id is not a secret.
# Do not put the Cloudflare account id in this file.
[[kv_namespaces]]
binding = "COACH_LIMITS"
id = "61b4d775bf86494ea78da40c6962bd54"

# [vars]
# AI_BASE_URL = "https://api.openai.com/v1"
# AI_MODEL = "gpt-4o-mini"
# AI_DAILY_CAP = "20"
